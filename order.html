<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上叫件 | Transnational Taiwan 德安台灣</title>
    <style>
        :root {
            --primary-color: #0b1622;
            --secondary-color: #c9971c;
            --secondary-light: #e6b94a;
            --bg-light: #f7f8fa;
            --text-main: #33424f;
            --text-light: #64748b;
            --border-hair: #e5e9ee;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif; color: var(--text-main); line-height: 1.6; background-color: var(--bg-light); }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        header { background-color: var(--primary-color); color: var(--white); padding: 15px 0; }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; color: var(--white); }
        .logo span { color: var(--secondary-color); }
        
        .user-info { display: flex; align-items: center; gap: 20px; }
        .btn-logout { color: var(--white); opacity: 0.8; font-size: 14px; text-decoration: underline; cursor: pointer; }

        .order-content { padding: 40px 0; }
        .order-card { background: var(--white); padding: 40px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .order-card h2 { margin-bottom: 30px; color: var(--primary-color); border-bottom: 2px solid var(--bg-light); padding-bottom: 15px; }

        .step-section { margin-bottom: 40px; }
        .step-title { display: flex; align-items: center; margin-bottom: 20px; }
        .step-num { width: 30px; height: 30px; background: var(--secondary-color); color: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight: bold; }
        .step-title h3 { font-size: 20px; color: var(--primary-color); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-main); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-hair); border-radius: 4px; font-family: inherit; background: var(--white); }
        .form-group input[readonly] { background: #f0f2f5; cursor: not-allowed; }
        
        .btn-submit { background-color: var(--secondary-color); color: var(--white); border: none; padding: 18px 40px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 18px; width: 100%; transition: var(--transition); margin-top: 20px; }
        .btn-submit:hover { background-color: var(--secondary-light); }

        .success-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .success-box { background: var(--white); padding: 50px; border-radius: 8px; text-align: center; max-width: 500px; }
        .success-box i { font-size: 60px; color: #2ecc71; margin-bottom: 20px; }
        .success-box h3 { font-size: 24px; margin-bottom: 15px; }
        .success-box p { margin-bottom: 30px; color: var(--text-light); }
        .btn-close { background: var(--primary-color); color: var(--white); padding: 12px 30px; border-radius: 4px; cursor: pointer; border: none; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">TRANS<span>NATIONAL</span> ONLINE</div>
            <div class="user-info">
                <span id="displayUserName">載入中...</span>
                <span class="btn-logout" onclick="logout()">登出</span>
            </div>
        </div>
    </header>

    <div class="order-content">
        <div class="container">
            <div class="order-card">
                <h2>線上叫件表單</h2>
                <form id="orderForm">
                    <div class="step-section">
                        <div class="step-title">
                            <div class="step-num">1</div>
                            <h3>選擇部門單位</h3>
                        </div>
                        <div class="form-grid">
                            <div class="form-group full">
                                <label for="deptSelect">部門 / 分機</label>
                                <select id="deptSelect" required>
                                    <option value="">請選擇部門</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>成本中心 Cost Center</label>
                                <input type="text" id="costCenter" readonly>
                            </div>
                            <div class="form-group">
                                <label>銀行代號</label>
                                <input type="text" id="bankCode" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="step-section">
                        <div class="step-title">
                            <div class="step-num">2</div>
                            <h3>填寫配送資訊</h3>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="expressType">快遞類型</label>
                                <select id="expressType" required>
                                    <option value="一般件">一般件</option>
                                    <option value="急件">急件</option>
                                    <option value="來回件">來回件</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="sender">送件人</label>
                                <input type="text" id="sender" required>
                            </div>
                            <div class="form-group full">
                                <label for="receiverAddr">收件地址</label>
                                <input type="text" id="receiverAddr" placeholder="請輸入完整的收件地址" required>
                            </div>
                            <div class="form-group">
                                <label for="receiverName">收件人</label>
                                <input type="text" id="receiverName" required>
                            </div>
                            <div class="form-group">
                                <label for="receiverPhone">收件人電話</label>
                                <input type="tel" id="receiverPhone" required>
                            </div>
                            <div class="form-group">
                                <label for="itemCount">件數</label>
                                <input type="number" id="itemCount" value="1" min="1" required>
                            </div>
                            <div class="form-group">
                                <label>叫件日期</label>
                                <input type="text" id="orderDate" readonly>
                            </div>
                            <div class="form-group full">
                                <label for="memo">備註 / 交辦事項</label>
                                <textarea id="memo" placeholder="如果有特殊需求請在此註明"></textarea>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">確認送出叫件申請</button>
                </form>
            </div>
        </div>
    </div>

    <div id="successOverlay" class="success-overlay">
        <div class="success-box">
            <i class="fas fa-check-circle"></i>
            <h3>叫件成功！</h3>
            <p>您的單號為：<strong id="orderNum">TW20260811001</strong></p>
            <p>系統已同步通知配送人員，請準備好您的文件。</p>
            <button class="btn-close" onclick="closeSuccess()">回到表單</button>
        </div>
    </div>

    <script>
        // 檢查登入狀態
        const customerId = sessionStorage.getItem('customer_id');
        const customerName = sessionStorage.getItem('customer_name');
        
        if (!customerId) {
            window.location.href = 'login.html';
        }

        document.getElementById('displayUserName').textContent = customerName;
        document.getElementById('bankCode').value = customerId;
        document.getElementById('orderDate').value = new Date().toLocaleDateString();

        // 初始化部門資料
        if (!localStorage.getItem('transnational_depts')) {
            const defaultDepts = [
                { customerId: 'HSBC', name: 'NKB 13F', ext: '6631-2319', costCenter: '11-001-388' },
                { customerId: 'HSBC', name: 'NKB 12F', ext: '6631-2305', costCenter: '11-001-389' },
                { customerId: 'HSBC', name: '敦北分行', ext: '2712-2211', costCenter: '11-002-001' }
            ];
            localStorage.setItem('transnational_depts', JSON.stringify(defaultDepts));
        }

        const allDepts = JSON.parse(localStorage.getItem('transnational_depts'));
        const myDepts = allDepts.filter(d => d.customerId === customerId);
        const deptSelect = document.getElementById('deptSelect');

        myDepts.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.name;
            opt.textContent = `${d.name} / 分機 ${d.ext}`;
            opt.dataset.cost = d.costCenter;
            deptSelect.appendChild(opt);
        });

        deptSelect.addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            document.getElementById('costCenter').value = selected.dataset.cost || '';
        });

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const orderNum = 'TW' + new Date().getTime().toString().slice(-10);
            document.getElementById('orderNum').textContent = orderNum;
            document.getElementById('successOverlay').style.display = 'flex';
        });

        function closeSuccess() {
            document.getElementById('successOverlay').style.display = 'none';
            document.getElementById('orderForm').reset();
            document.getElementById('orderDate').value = new Date().toLocaleDateString();
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
    </script>

</body>
</html>
