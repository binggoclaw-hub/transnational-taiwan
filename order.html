<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上叫件 | Transnational Taiwan 德安台灣</title>
    <style>
        :root {
            --primary-color: #0b1622;
            --secondary-color: #c9971c;
            --secondary-light: #e6b94a;
            --bg-light: #f7f8fa;
            --text-main: #33424f;
            --text-light: #64748b;
            --border-hair: #e5e9ee;
            --white: #ffffff;
            --sender-bg: #fff9e6;
            --recipient-bg: #fff0f3;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif; color: var(--text-main); line-height: 1.6; background-color: var(--bg-light); }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        header { background-color: var(--primary-color); color: var(--white); padding: 15px 0; }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; }
        .logo img { height: 42px; mix-blend-mode: screen; }
        
        .user-info { display: flex; align-items: center; gap: 20px; }
        .btn-logout { color: var(--white); opacity: 0.8; font-size: 14px; text-decoration: underline; cursor: pointer; }

        .order-content { padding: 40px 0; }
        .order-card { background: var(--white); padding: 40px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .order-card h2 { margin-bottom: 10px; color: var(--primary-color); }
        .form-hint { background: #eef2f7; padding: 15px; border-radius: 4px; margin-bottom: 30px; border-left: 4px solid var(--primary-color); font-weight: bold; }

        .section-box { padding: 30px; border-radius: 8px; margin-bottom: 0; border: 2px solid transparent; }
        .sender-section { background-color: var(--sender-bg); border-color: #ffeeb3; }
        .recipient-section { background-color: var(--recipient-bg); border-color: #ffdce5; }
        
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--secondary-color); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--primary-color); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; background: var(--white); }
        .form-group input[readonly] { background-color: #f0f2f5; cursor: not-allowed; }

        .divider { height: 0; border-top: 3px solid #ddd; margin: 30px 0; }

        .btn-submit { background-color: var(--primary-color); color: var(--white); border: none; padding: 18px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: var(--transition); font-size: 18px; margin-top: 30px; }
        .btn-submit:hover { background-color: var(--secondary-color); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .success-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .success-box { background: var(--white); padding: 50px; border-radius: 8px; text-align: center; max-width: 500px; }
        .success-box i { font-size: 60px; color: #2ecc71; margin-bottom: 20px; }
        .success-box h3 { font-size: 24px; margin-bottom: 15px; }
        .success-box p { margin-bottom: 30px; color: var(--text-light); }
        .btn-close { background: var(--primary-color); color: var(--white); padding: 12px 30px; border-radius: 4px; cursor: pointer; border: none; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            .order-card { padding: 20px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo"><img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663752346972/UtMhcZkYSXunXleZ.jpg" alt="Transnational Group" style="height:42px; vertical-align:middle; mix-blend-mode: screen;"> ONLINE</div>
            <div class="user-info">
                <span id="displayUserName" style="color:white">載入中...</span>
                <span class="btn-logout" onclick="logout()">登出</span>
            </div>
        </div>
    </header>

    <div class="order-content">
        <div class="container">
            <div class="order-card">
                <h2>線上快遞叫件 <small style="font-size: 14px; font-weight: normal; color: var(--text-light);">Online Courier Request</small></h2>
                
                <div class="form-hint">
                    💡 送件資訊請填寫於下方金色區塊，收件資訊請填寫於粉色區塊。
                </div>

                <form id="orderForm">
                    <!-- Sender Section -->
                    <div class="section-box sender-section">
                        <div class="section-title"><i class="fas fa-box"></i> 📦 送件方資訊 Sender Information</div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>快遞類型 Type</label>
                                <select id="expressType" required>
                                    <option value="一般件">一般件 Standard</option>
                                    <option value="急件">急件 Urgent</option>
                                    <option value="來回件">來回件 Round-trip</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>叫件日期 Date</label>
                                <input type="text" id="orderDate" readonly>
                            </div>
                            <div class="form-group">
                                <label>部門 / 分機 Department</label>
                                <select id="deptSelect" required>
                                    <option value="">請選擇部門</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>成本中心 Cost Center</label>
                                <input type="text" id="costCenter" readonly>
                            </div>
                            <div class="form-group">
                                <label>送件人姓名 Sender Name</label>
                                <input type="text" id="senderName" required placeholder="請輸入姓名">
                            </div>
                            <div class="form-group">
                                <label>送件人電話 Sender Phone</label>
                                <input type="tel" id="senderPhone" required placeholder="請輸入聯絡電話">
                            </div>
                            <div class="form-group full">
                                <label>送件地址 Sender Address</label>
                                <input type="text" id="senderAddress" required placeholder="例如：NKB 13F 或 完整外部地址">
                            </div>
                            <div class="form-group">
                                <label>件數 Quantity</label>
                                <input type="number" id="quantity" value="1" min="1" required>
                            </div>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <!-- Recipient Section -->
                    <div class="section-box recipient-section">
                        <div class="section-title"><i class="fas fa-paper-plane"></i> 📬 收件方資訊 Recipient Information</div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>收件人姓名 Recipient Name</label>
                                <input type="text" id="recipientName" required placeholder="請輸入收件人姓名">
                            </div>
                            <div class="form-group">
                                <label>收件人電話 Recipient Phone</label>
                                <input type="tel" id="recipientPhone" required placeholder="請輸入收件人電話">
                            </div>
                            <div class="form-group full">
                                <label>收件地址 Recipient Address</label>
                                <input type="text" id="recipientAddress" required placeholder="請輸入完整收件地址">
                            </div>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <!-- Remarks -->
                    <div class="form-group full">
                        <label>備註 / 交辦事項 Remarks</label>
                        <textarea id="remarks" placeholder="如有特殊需求請在此註明..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">確認送出叫件申請 SUBMIT REQUEST</button>
                </form>
            </div>
        </div>
    </div>

    <div id="successOverlay" class="success-overlay">
        <div class="success-box">
            <i class="fas fa-check-circle"></i>
            <h3>叫件成功！</h3>
            <p>您的單號為：<strong id="orderNum">TW20260811001</strong></p>
            <p>系統已同步通知德安交控中心，請準備好您的文件。</p>
            <button class="btn-close" onclick="closeSuccess()">回到首頁</button>
        </div>
    </div>

    <script>
        // Check login status
        const customerId = sessionStorage.getItem('customer_id');
        const customerName = sessionStorage.getItem('customer_name');
        
        if (!customerId) {
            window.location.href = 'login.html';
        }

        document.getElementById('displayUserName').textContent = customerName;
        document.getElementById('orderDate').value = new Date().toLocaleDateString();

        // Initialize department data
        if (!localStorage.getItem('transnational_depts')) {
            const defaultDepts = [
                { customerId: 'HSBC', name: 'NKB 13F', ext: '6631-2319', costCenter: '11-001-388' },
                { customerId: 'HSBC', name: 'NKB 12F', ext: '6631-2305', costCenter: '11-001-389' },
                { customerId: 'HSBC', name: '敦北分行', ext: '2712-2211', costCenter: '11-002-001' }
            ];
            localStorage.setItem('transnational_depts', JSON.stringify(defaultDepts));
        }

        const allDepts = JSON.parse(localStorage.getItem('transnational_depts'));
        const myDepts = allDepts.filter(d => d.customerId === customerId);
        const deptSelect = document.getElementById('deptSelect');

        myDepts.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.name;
            opt.textContent = `${d.name} / 分機 ${d.ext}`;
            opt.dataset.cost = d.costCenter;
            deptSelect.appendChild(opt);
        });

        deptSelect.addEventListener('change', function() {
            const selected = this.options[this.selectedIndex];
            document.getElementById('costCenter').value = selected.dataset.cost || '';
            if (selected.value) {
                document.getElementById('senderAddress').value = selected.value;
            }
        });

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const orderNum = 'TW' + new Date().getTime().toString().slice(-10);
            document.getElementById('orderNum').textContent = orderNum;
            document.getElementById('successOverlay').style.display = 'flex';
        });

        function closeSuccess() {
            window.location.href = 'index.html';
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
    </script>

</body>
</html>
