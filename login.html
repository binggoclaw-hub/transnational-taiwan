<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶登入 | Transnational Taiwan 德安台灣</title>
    <style>
        :root {
            --primary-color: #0b1622;
            --secondary-color: #c9971c;
            --secondary-light: #e6b94a;
            --bg-light: #f7f8fa;
            --text-main: #33424f;
            --text-light: #64748b;
            --border-hair: #e5e9ee;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif; color: var(--text-main); line-height: 1.6; background-color: var(--bg-light); display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        ul { list-style: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header { background-color: var(--primary-color); color: var(--white); padding: 15px 0; }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; color: var(--white); display: flex; align-items: center; }
        .logo .trans { color: var(--white); }
        .logo .national { color: var(--secondary-color); margin-left: 5px; }
        
        .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .login-card { background: var(--white); padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; margin-bottom: 30px; color: var(--primary-color); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border-hair); border-radius: 4px; font-family: inherit; }
        
        .btn-login { background-color: var(--secondary-color); color: var(--white); border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; transition: var(--transition); }
        .btn-login:hover { background-color: var(--secondary-light); }
        
        .login-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-light); }
        .test-info { margin-top: 30px; padding: 15px; background: #fff9e6; border: 1px solid #ffeeba; border-radius: 4px; font-size: 13px; }

        footer { background-color: var(--primary-color); color: var(--white); padding: 40px 0 20px; margin-top: auto; }
        .footer-bottom { text-align: center; font-size: 14px; color: rgba(255,255,255,0.5); }

        .error-msg { color: #e74c3c; font-size: 14px; margin-bottom: 15px; display: none; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <a href="index.html" class="logo"><img src="https://binggoclaw-hub.github.io/transnational-taiwan/螢幕擷取畫面_2024-03-04_090807.png" alt="Transnational Group" style="height:34px; background:#fff; padding:4px 8px; border-radius:4px;"></a>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <h2>客戶登入</h2>
            <div id="errorMsg" class="error-msg">帳號或密碼錯誤</div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">客戶代碼 Customer Code</label>
                    <input type="text" id="username" placeholder="請輸入客戶代碼" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼 Password</label>
                    <input type="password" id="password" placeholder="請輸入密碼" required>
                </div>
                <button type="submit" class="btn-login">登入 LOGIN</button>
            </form>
            <div class="login-footer">
                <a href="index.html">← 回到首頁</a>
            </div>
            <div class="test-info">
                <strong>測試帳號：</strong><br>
                客戶代碼：HSBC<br>
                密碼：1234
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                &copy; 2026 新加坡商德安中華有限公司台灣分公司 Transnational Taiwan.
            </div>
        </div>
    </footer>

    <script>
        // 初始化預設客戶資料到 localStorage (如果不存在)
        if (!localStorage.getItem('transnational_customers')) {
            const defaultCustomers = [
                { id: 'HSBC', name: '匯豐銀行 HSBC', password: '1234', status: '有效' }
            ];
            localStorage.setItem('transnational_customers', JSON.stringify(defaultCustomers));
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // 檢查管理員登入
            if (user === 'admin' && pass === 'admin123') {
                sessionStorage.setItem('admin_logged_in', 'true');
                window.location.href = 'admin.html';
                return;
            }

            // 檢查客戶登入
            const customers = JSON.parse(localStorage.getItem('transnational_customers'));
            const customer = customers.find(c => c.id === user && c.password === pass);

            if (customer) {
                sessionStorage.setItem('customer_id', customer.id);
                sessionStorage.setItem('customer_name', customer.name);
                window.location.href = 'order.html';
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>

</body>
</html>
